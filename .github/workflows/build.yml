name: Build All Minecraft Mod Variants

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  # The matrix comes from versions/ rather than being written out here, so adding a Minecraft
  # version stays a one-file change - including versions only one loader can build.
  matrix:
    name: Work out the build matrix
    runs-on: ubuntu-latest
    outputs:
      combinations: ${{ steps.combinations.outputs.combinations }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Read versions/
        id: combinations
        run: |
          python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json
          import pathlib

          combinations = []
          for path in sorted(pathlib.Path("versions").glob("*.properties")):
              version = path.name[: -len(".properties")]
              loaders = ["neoforge", "fabric"]
              for line in path.read_text().splitlines():
                  line = line.strip()
                  if line.startswith("loaders="):
                      loaders = [p.strip() for p in line.split("=", 1)[1].split(",") if p.strip()]
              for loader in loaders:
                  combinations.append({"loader": loader, "minecraft": version})

          if not combinations:
              raise SystemExit("No version definitions found in versions/")

          print("combinations=" + json.dumps(combinations))
          PY

      - name: Show the matrix
        run: echo '${{ steps.combinations.outputs.combinations }}'

  build:
    name: ${{ matrix.loader }} / MC ${{ matrix.minecraft }}
    runs-on: ubuntu-latest
    needs: matrix

    strategy:
      # One broken combination should not hide the state of the others.
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.matrix.outputs.combinations) }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '25'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # -Ploaders limits the build to this job's loader, so a problem with one loader cannot
      # fail the other loader's jobs.
      - name: Build
        run: >
          ./gradlew ":${{ matrix.loader }}:build"
          -Pmc=${{ matrix.minecraft }}
          -Ploaders=${{ matrix.loader }}
          --stacktrace

      - name: Upload Compiled JAR
        uses: actions/upload-artifact@v4
        with:
          name: seeleaderzombie-${{ matrix.loader }}-${{ matrix.minecraft }}
          path: ${{ matrix.loader }}/build/libs/*.jar
          if-no-files-found: error

  collect:
    name: Collect all JARs
    runs-on: ubuntu-latest
    needs: build
    if: always()

    steps:
      - name: Download every variant
        uses: actions/download-artifact@v4
        with:
          pattern: seeleaderzombie-*
          merge-multiple: true
          path: builds

      - name: Upload combined artifact
        uses: actions/upload-artifact@v4
        with:
          name: SeeLeaderZombie-Mod-JARs
          path: builds/*.jar
          if-no-files-found: error
