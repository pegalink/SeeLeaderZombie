pluginManagement {
    repositories {
        mavenLocal()
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        gradlePluginPortal()
    }

    // Declared here so the subprojects can apply the plugins without repeating a version,
    // and so both can be bumped from gradle.properties (or -Pmoddev_version=/-Ploom_version=).
    plugins {
        id 'net.neoforged.moddev' version "${settings.providers.gradleProperty('moddev_version').get()}"
        id 'net.fabricmc.fabric-loom' version "${settings.providers.gradleProperty('loom_version').get()}"
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'SeeLeaderZombie'

// The selected Minecraft version and its loaders are resolved here, before any project is
// configured, because which projects exist at all depends on them. build.gradle reads the
// results back off gradle.ext so the version files are only parsed once.

def knownLoaders = ['neoforge', 'fabric']

def splitList = { value ->
    value.toString().split(',').collect { it.trim() }.findAll { !it.isEmpty() }
}

def gradleProperty = { String name ->
    settings.startParameter.projectProperties.get(name)
            ?: settings.providers.gradleProperty(name).getOrNull()
}

def versionsDir = new File(settings.rootDir, 'versions')
def availableVersions = (versionsDir.listFiles() ?: new File[0])
        .findAll { it.name.endsWith('.properties') }
        .collect { it.name - '.properties' }
        .sort()

if (availableVersions.isEmpty()) {
    throw new GradleException("No version definitions found in ${versionsDir}.")
}

def selectedVersion = (gradleProperty('mc') ?: gradleProperty('default_minecraft_version')).toString()
def versionFile = new File(versionsDir, "${selectedVersion}.properties")

if (!versionFile.isFile()) {
    throw new GradleException(
            "Unknown Minecraft version '${selectedVersion}'. Supported: ${availableVersions.join(', ')}.\n" +
            "Pass one with -Pmc=<version>, or add versions/${selectedVersion}.properties to support it.")
}

def versionProperties = new Properties()
versionFile.withInputStream { versionProperties.load(it) }

// Not every Minecraft version has both loaders - NeoForge publishes nothing for snapshots, for
// instance - so each version file says which ones it can build.
def supportedLoaders = splitList(versionProperties.getProperty('loaders') ?: knownLoaders.join(','))

supportedLoaders.each { loader ->
    if (!knownLoaders.contains(loader)) {
        throw new GradleException(
                "versions/${selectedVersion}.properties lists unknown loader '${loader}'. " +
                "Known loaders: ${knownLoaders.join(', ')}.")
    }
}

// Gradle configures every included project, so without narrowing this a NeoForge-only build
// would still have to resolve the Fabric Loom plugin - and a problem with one loader would fail
// the other's build. CI passes -Ploaders=<loader> so each matrix job stands on its own.
def requestedProperty = gradleProperty('loaders')
def requestedLoaders = requestedProperty == null ? supportedLoaders : splitList(requestedProperty)

if (requestedLoaders.isEmpty()) {
    throw new GradleException("-Ploaders was empty. Known loaders: ${knownLoaders.join(', ')}.")
}

requestedLoaders.each { loader ->
    if (!knownLoaders.contains(loader)) {
        throw new GradleException("Unknown loader '${loader}'. Known loaders: ${knownLoaders.join(', ')}.")
    }
    if (!supportedLoaders.contains(loader)) {
        throw new GradleException(
                "${loader} does not support Minecraft ${selectedVersion}. " +
                "That version builds for: ${supportedLoaders.join(', ')}.")
    }
}

gradle.ext.szSelectedVersion = selectedVersion
gradle.ext.szVersionProperties = versionProperties
gradle.ext.szAvailableVersions = availableVersions
gradle.ext.szSupportedLoaders = supportedLoaders

requestedLoaders.each { include it }
