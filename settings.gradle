pluginManagement {
    repositories {
        mavenLocal()
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        gradlePluginPortal()
    }

    // Declared here so the subprojects can apply the plugins without repeating a version,
    // and so both can be bumped from gradle.properties (or -Pmoddev_version=/-Ploom_version=).
    plugins {
        id 'net.neoforged.moddev' version "${settings.providers.gradleProperty('moddev_version').get()}"
        id 'net.fabricmc.fabric-loom' version "${settings.providers.gradleProperty('loom_version').get()}"
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'SeeLeaderZombie'

include 'neoforge'
include 'fabric'
