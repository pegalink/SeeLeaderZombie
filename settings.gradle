pluginManagement {
    repositories {
        mavenLocal()
        maven {
            name = 'NeoForged'
            url = 'https://maven.neoforged.net/releases'
        }
        maven {
            name = 'Fabric'
            url = 'https://maven.fabricmc.net/'
        }
        gradlePluginPortal()
    }

    // Declared here so the subprojects can apply the plugins without repeating a version,
    // and so both can be bumped from gradle.properties (or -Pmoddev_version=/-Ploom_version=).
    plugins {
        id 'net.neoforged.moddev' version "${settings.providers.gradleProperty('moddev_version').get()}"
        id 'net.fabricmc.fabric-loom' version "${settings.providers.gradleProperty('loom_version').get()}"
    }
}

plugins {
    id 'org.gradle.toolchains.foojay-resolver-convention' version '1.0.0'
}

rootProject.name = 'SeeLeaderZombie'

// Gradle configures every included project, so without this a NeoForge-only build would still
// have to resolve the Fabric Loom plugin - and a problem with one loader would fail the other's
// build. CI passes -Ploaders=<loader> so each matrix job stands on its own.
def knownLoaders = ['neoforge', 'fabric']
def requestedLoaders = (settings.startParameter.projectProperties.get('loaders') ?: knownLoaders.join(','))
        .split(',')
        .collect { it.trim() }
        .findAll { !it.isEmpty() }

if (requestedLoaders.isEmpty()) {
    throw new GradleException("-Ploaders was empty. Supported loaders: ${knownLoaders.join(', ')}.")
}

requestedLoaders.each { loader ->
    if (!knownLoaders.contains(loader)) {
        throw new GradleException("Unknown loader '${loader}'. Supported: ${knownLoaders.join(', ')}.")
    }
    include loader
}
