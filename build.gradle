/*
 * Root build for every SeeLeaderZombie variant.
 *
 * There is one copy of the sources (common/, neoforge/, fabric/) and one file per supported
 * Minecraft version under versions/. settings.gradle picks the version and works out which
 * loaders it can build; this file hands those properties to the subprojects.
 *
 *     ./gradlew build                       # the default version, its loaders
 *     ./gradlew build -Pmc=26.2             # a specific version
 *     ./gradlew :fabric:build -Pmc=26.1.1 -Ploaders=fabric
 *     ./gradlew supportedVersions           # what can be built
 *     ./build_all.sh                        # every supported loader x version pair
 */

def selectedVersion = gradle.ext.szSelectedVersion
def versionProperties = gradle.ext.szVersionProperties
def availableVersions = gradle.ext.szAvailableVersions

allprojects {
    // Every per-version coordinate (Minecraft, NeoForge, Fabric API, dependency ranges) reaches
    // the build only through here, so adding a Minecraft version never means editing a build file.
    ext.mc = selectedVersion
    versionProperties.each { key, value -> ext.set(key.toString(), value.toString()) }
}

def versionSummaries = availableVersions.collect { version ->
    def properties = new Properties()
    rootProject.file("versions/${version}.properties").withInputStream { properties.load(it) }
    def loaders = (properties.getProperty('loaders') ?: 'neoforge,fabric')
            .split(',').collect { it.trim() }.findAll { !it.isEmpty() }
    "  ${version} -> ${loaders.join(', ')}"
}

tasks.register('supportedVersions') {
    group = 'help'
    description = 'Lists the Minecraft versions this repository can build, and their loaders.'
    def summaries = versionSummaries
    def current = selectedVersion
    doLast {
        println 'Supported Minecraft versions:'
        summaries.each { println it }
        println "Currently selected: ${current} (override with -Pmc=<version>)"
    }
}
