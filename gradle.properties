# Sets default memory used for gradle commands. Can be overridden by user or command line properties.
org.gradle.jvmargs=-Xmx3G
org.gradle.daemon=true
org.gradle.parallel=true
org.gradle.caching=true
# Fabric Loom does not support Gradle's configuration cache - leaving this on breaks the Fabric build.
org.gradle.configuration-cache=false

## Build target
# Minecraft version built when -Pmc=<version> is not supplied.
# Must name a file in versions/, which is the single source of truth for per-version dependencies.
default_minecraft_version=26.1.2

## Loader plugin versions (shared by every Minecraft version, override with -P if needed)
moddev_version=2.0.141
loom_version=1.17.17

## Toolchain
java_version=25

## Mod Properties
# The unique mod identifier. Must be lowercase in English locale, matching [a-z][a-z0-9_]{1,63}.
mod_id=seeleaderzombie
# The human-readable display name for the mod.
mod_name=SeeLeaderZombie
# The license of the mod.
mod_license=GNU GPL v3
# The mod version. See https://semver.org/
mod_version=1.3
# The group ID for the mod, matching the base package used for the mod sources.
mod_group_id=net.robotic
# The authors of the mod, used for display purposes in the mod list.
mod_authors=roboticrobot
# The description of the mod, used for display purposes in the mod list.
mod_description=A mod that shows you the leader zombie. Pretty scary!
# Source repository, surfaced in the mod metadata.
mod_sources=https://github.com/roboticrobot/SeeLeaderZombie
