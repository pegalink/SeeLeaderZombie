plugins {
    id 'java'
    id 'maven-publish'
    id 'net.fabricmc.fabric-loom'
}

version = mod_version
group = mod_group_id

repositories {
    maven {
        name = 'Fabric'
        url = 'https://maven.fabricmc.net/'
    }
}

base {
    // The Minecraft version is part of the name so every variant can sit in one output folder.
    archivesName = "${mod_id}-fabric-${minecraft_version}"
}

// Loader-agnostic logic lives in common/ and is compiled into both the NeoForge and Fabric jars.
sourceSets.main.java.srcDir rootProject.file('common/src/main/java')
sourceSets.main.resources.srcDir rootProject.file('common/src/main/resources')

loom {
    // No splitEnvironmentSourceSets(): this mod is server-side logic with no client source set,
    // and declaring the split without one makes Loom fail to configure the mod.
    mods {
        "${mod_id}" {
            sourceSet sourceSets.main
        }
    }
}

dependencies {
    minecraft "com.mojang:minecraft:${minecraft_version}"

    // No "mappings" line and plain "implementation" rather than "modImplementation": Minecraft
    // 26.x ships unobfuscated, so there is nothing to remap. Loom rejects
    // loom.officialMojangMappings() outright with "Cannot use Mojang mappings in a
    // non-obfuscated environment".
    implementation "net.fabricmc:fabric-loader:${fabric_loader_version}"
    implementation "net.fabricmc.fabric-api:fabric-api:${fabric_api_version}"
}

// fabric.mod.json is templated so its Minecraft/loader ranges come from versions/<mc>.properties.
processResources {
    var replaceProperties = [mod_id                     : mod_id,
                             mod_name                   : mod_name,
                             mod_version                : mod_version,
                             mod_description            : mod_description,
                             mod_authors                : mod_authors,
                             mod_sources                : mod_sources,
                             java_version               : java_version,
                             fabric_loader_dependency   : fabric_loader_dependency,
                             fabric_minecraft_dependency: fabric_minecraft_dependency]
    inputs.properties replaceProperties
    filesMatching('fabric.mod.json') {
        expand replaceProperties
    }
}

tasks.withType(JavaCompile).configureEach {
    options.release = java_version as int
    options.encoding = 'UTF-8'
}

java {
    toolchain.languageVersion = JavaLanguageVersion.of(java_version as int)
    withSourcesJar()
}

jar {
    from(rootProject.file('LICENSE')) {
        rename { "${it}_${mod_id}" }
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            artifactId = base.archivesName.get()
            from components.java
        }
    }
    repositories {
        maven {
            url = layout.buildDirectory.dir('repo')
        }
    }
}
