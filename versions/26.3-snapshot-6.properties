# Minecraft 26.3-snapshot-6 - Fabric only.
# NeoForge publishes no builds for snapshots, so this version has no neo_* coordinates and the
# NeoForge project is not part of the build when it is selected. When NeoForge ships 26.3, add
# its coordinates here and put neoforge back in the loaders list.
minecraft_version=26.3-snapshot-6
# Which loaders publish builds for this Minecraft version.
loaders=fabric

## Fabric
# https://fabricmc.net/develop/
# Fabric API's 26.3 branch targets minecraft_version=26.3-snapshot-6 and releases as "+26.3":
# the published artifact is "[26.3-snapshot-6] Fabric API 0.156.1+26.3".
fabric_loader_version=0.19.3
fabric_loader_dependency=>=0.19.0
fabric_api_version=0.156.1+26.3
# Pinned exactly rather than ranged. A snapshot is a moving target: ">=26.3-snapshot-6" would
# also claim compatibility with later snapshots that can change the API again, and snapshot
# names do not order the way release versions do.
fabric_minecraft_dependency=["26.3-snapshot-6"]
